<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Portal</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: system-ui, sans-serif; }
        #nav { height: 50px; background: #121212; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #262626; }
        .btn { background: #0095f6; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn:hover { background: #1877f2; }
        iframe { width: 100%; height: calc(100% - 50px); border: none; background: #fff; }
    </style>
</head>
<body>
    <div id="nav">
        <span style="font-family: monospace; font-size: 13px; color: #aaa;">TUNNEL STATUS: READY</span>
        <button class="btn" onclick="connect()">CONNECT TO INSTAGRAM</button>
    </div>
    <iframe id="view" src="about:blank" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>
    <script>
        async function connect() {
            const frame = document.getElementById('view');
            // Base64 encoded target destination to bypass keyword blocks
            const target = atob("aHR0cHM6Ly93d3cuaW5zdGFncmFtLmNvbQ==");
            
            // Routes traffic through an external pipeline to strip frame security blocks
            const proxy = 'https://allorigins.win' + encodeURIComponent(target);
            
            try {
                const res = await fetch(proxy);
                const data = await res.json();
                let html = data.contents;
                
                // Remap relative asset paths back to the source server
                html = html.replace(/href="\/([^"]+)"/g, 'href="https://instagram.com"');
                html = html.replace(/src="\/([^"]+)"/g, 'src="https://instagram.com"');
                
                const doc = frame.contentWindow.document;
                doc.open(); doc.write(html); doc.close();
            } catch (err) {
                alert("Connection failed. Your network may be blocking the proxy utility.");
            }
        }
    </script>
</body>
</html>
